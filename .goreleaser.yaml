# goreleaser config for claude-janitor (schema v2).
# Builds static Mac/Linux/Windows binaries and publishes archives + checksums
# to a GitHub Release, then updates the Homebrew / Scoop / Winget manifests.
#
# Run locally without publishing:  goreleaser release --snapshot --clean
# Real release (from GitHub Actions on a v* tag):  goreleaser release --clean
#
# Archives + checksums + the GitHub Release need no extra setup.
#
# The store blocks below (Homebrew cask / Scoop / Winget) each carry a
# skip_upload guard keyed on their own token: when the token env var is unset or
# empty, goreleaser skips that publish step instead of failing the release. So a
# tag pushed today still ships six downloadable binaries and a green build, and
# the store pushes switch on by themselves once the registry repos and the three
# Actions secrets exist (see README "Publishing"). Leave the guards in place.
version: 2

project_name: claude-janitor

before:
  hooks:
    - go mod tidy

builds:
  - id: claude-janitor
    main: .
    binary: claude-janitor
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# --- Homebrew (macOS): needs a tap repo Melodymaifafa/homebrew-tap + a PAT in
#     HOMEBREW_TAP_GITHUB_TOKEN; skipped while that secret is absent. See README
#     "Publishing". The post-install hook strips the Gatekeeper quarantine flag
#     from the unsigned binary. ---
homebrew_casks:
  - name: claude-janitor
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    repository:
      owner: Melodymaifafa
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/Melodymaifafa/claude-janitor
    description: Reclaim memory by killing idle Claude Code session processes
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/claude-janitor"]
          end

# --- Scoop (Windows): needs a bucket repo Melodymaifafa/scoop-bucket;
#     skipped while SCOOP_BUCKET_GITHUB_TOKEN is absent. ---
scoops:
  - skip_upload: '{{ if envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    repository:
      owner: Melodymaifafa
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/Melodymaifafa/claude-janitor
    description: Reclaim memory by killing idle Claude Code session processes
    license: MIT

# --- Winget (Windows): opens a PR against microsoft/winget-pkgs via a fork;
#     skipped while WINGET_GITHUB_TOKEN is absent. ---
winget:
  - name: claude-janitor
    skip_upload: '{{ if envOrDefault "WINGET_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    publisher: Melodymaifafa
    short_description: Reclaim memory by killing idle Claude Code session processes
    license: MIT
    homepage: https://github.com/Melodymaifafa/claude-janitor
    repository:
      owner: Melodymaifafa
      name: winget-pkgs
      branch: "claude-janitor-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  github:
    owner: Melodymaifafa
    name: claude-janitor
  draft: false
  prerelease: auto
