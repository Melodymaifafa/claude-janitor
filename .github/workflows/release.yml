name: release

# Builds and publishes cross-platform binaries when a v* tag is pushed.
# Archives + checksums + the GitHub Release need no extra setup (GITHUB_TOKEN is
# automatic). The Homebrew / Scoop / Winget manifest pushes need registry repos
# and PATs that only the repo owner can create -- see README "Publishing".
#
# The three secrets below are optional: an absent secret arrives here as an empty
# string, and the matching skip_upload guard in .goreleaser.yaml turns that one
# publish step into a skip. So this job stays green and still ships the six
# binaries with none of them set, and each store switches on the moment its
# secret is added. Do not remove the env lines -- goreleaser reads them.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these repo secrets to also publish package manifests.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
